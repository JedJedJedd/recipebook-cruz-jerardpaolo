<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Recipe Book{% endblock %}</title>
    {% block styles %}{% endblock %}
    <h1>Recipe Book</h1> 
</head>
<body>
    <ul>
        {% for recipe in recipes %}
            <li>
                <a href="{% url 'ledger:detail' recipe.name %}">{{ recipe.name }}</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
