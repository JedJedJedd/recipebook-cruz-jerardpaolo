{% extends "base.html" %}

{% block title %}Recipes - Recipe Book{% endblock %}

{% block page_title %}All Recipes{% endblock %}

{% block content %}
    <ul>
        {% for recipe in recipes %}
            <li>
                <a href="{% url 'ledger:detail' recipe.name %}">{{ recipe.name }}</a>
            </li>
        {% empty %}
            <li>No recipes available.</li>
        {% endfor %}
    </ul>
{% endblock %}
