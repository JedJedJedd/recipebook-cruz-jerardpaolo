<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Recipe Book{% endblock %}</title>
    {% block styles %}{% endblock %}
</head>
<body>
    <h1>Recipe Book</h1>
    <ul>
        {% for ingredient in ingredients %}
            <li>{{ ingredient.name }} - {{ ingredient.quantity }}</li>
        {% endfor %}
    </ul>
</body>
</html>
